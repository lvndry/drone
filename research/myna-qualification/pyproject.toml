[project]
name = "drone-myna-qualification"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.11.0+cu130",
  "torchaudio==2.11.0+cu130",
  "nnAudio==0.3.4",
  "numpy==2.5.4",
  "scipy==1.18.1",
  "einops==0.8.1",
  "transformers==4.57.6",
  "huggingface-hub==0.36.2",
  "safetensors==0.8.0",
  "tokenizers==0.22.2",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }
