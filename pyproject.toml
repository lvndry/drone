[project]
name = "drone-key"
version = "0.1.0"
description = "A small neural classifier for musical key detection"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = [
    "blake3>=1.0.11",
    "librosa>=0.10",
    "numpy>=1.24",
    "torch>=2.6",
]

[project.optional-dependencies]
research = ["nnAudio==0.3.4"]
export = [
    "onnx>=1.23.2",
    "onnxruntime>=1.31.1",
    "onnxscript>=0.7.2",
]
plots = [
    "matplotlib>=3.10",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9", "ty>=0.0.101"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = ["/PLAN.md"]

[tool.hatch.build.targets.wheel]
packages = ["drone"]

[tool.hatch.build.targets.wheel.force-include]
"weights" = "drone/weights"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
