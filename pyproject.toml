[project]
name = "drone-key"
version = "0.1.0"
description = "A small neural classifier for musical key detection"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = [
    "librosa>=0.10",
    "numpy>=1.24",
    "torch>=2.6",
]

[project.optional-dependencies]
export = [
    "onnx>=1.23.2",
    "onnxruntime>=1.31.1",
    "onnxscript>=0.7.2",
]

[dependency-groups]
dev = ["mypy>=1.13", "pytest>=8", "ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = ["/PLAN.md"]

[tool.hatch.build.targets.wheel]
packages = ["drone"]

[tool.hatch.build.targets.wheel.force-include]
"weights" = "drone/weights"

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["librosa.*", "onnxruntime.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
